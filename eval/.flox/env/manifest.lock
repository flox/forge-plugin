    "hook": {
      "on-activate": "  # Sync Python dependencies (creates .venv if needed)\n  cd \"$FLOX_ENV_PROJECT\"\n  uv sync --quiet 2>/dev/null || uv sync\n"
    },
    "profile": {
      "common": "  echo \"\"\n  echo \"Forge Plugin Eval Environment\"\n  echo \"  Python:  $(uv run python --version 2>/dev/null)\"\n  echo \"  pytest:  $(uv run pytest --version 2>/dev/null | head -1)\"\n  echo \"\"\n  if [ -z \"$ANTHROPIC_API_KEY\" ]; then\n    echo \"  ⚠ ANTHROPIC_API_KEY not set — tests will be skipped\"\n    echo \"  Set it with: export ANTHROPIC_API_KEY=sk-ant-...\"\n  else\n    echo \"  ✓ ANTHROPIC_API_KEY is set\"\n  fi\n  echo \"\"\n  echo \"  Run evals:\"\n  echo \"    uv run pytest scenarios/smoke/ -m smoke -v        # Tier 1\"\n  echo \"    uv run pytest scenarios/integration/ -m integration -v  # Tier 2\"\n  echo \"    uv run pytest scenarios/e2e/ -m e2e -v            # Tier 3\"\n  echo \"\"\n"
    },
    "options": {}
  },
