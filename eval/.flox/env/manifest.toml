schema-version = "1.10.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
python311.pkg-path = "python311"
mypy.pkg-path = "mypy"
uv.pkg-path = "uv"
ruff.pkg-path = "ruff"
git.pkg-path = "git"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  # Sync Python dependencies (creates .venv if needed)
  cd "$FLOX_ENV_PROJECT"
  uv sync --quiet 2>/dev/null || uv sync
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
common = '''
  echo ""
  echo "Forge Plugin Eval Environment"
  echo "  Python:  $(uv run python --version 2>/dev/null)"
  echo "  pytest:  $(uv run pytest --version 2>/dev/null | head -1)"
  echo ""
  if [ -z "$ANTHROPIC_API_KEY" ]; then
    echo "  ⚠ ANTHROPIC_API_KEY not set — tests will be skipped"
    echo "  Set it with: export ANTHROPIC_API_KEY=sk-ant-..."
  else
    echo "  ✓ ANTHROPIC_API_KEY is set"
  fi
  echo ""
  echo "  Run evals:"
  echo "    uv run pytest scenarios/smoke/ -m smoke -v        # Tier 1"
  echo "    uv run pytest scenarios/integration/ -m integration -v  # Tier 2"
  echo "    uv run pytest scenarios/e2e/ -m e2e -v            # Tier 3"
  echo ""
'''


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
